name: rollout_config
description: Bundle worker concurrency, task count, and start index for benchmark evaluation.
display_name: rollout_config
base_class: PodExecutionNode
python_code: /workspace/nodes/custom_py_script/rollout_config.py
function_name: rollout_config
python_command: /root/pyromind-sdk-example/.venv/bin/python
parameters:
  - name: works
    dtype: INT
    type: input
    required_type: required
  - name: num_tasks
    dtype: INT
    type: input
    required_type: optional
  - name: start_index
    dtype: INT
    type: input
    required_type: optional
  - name: rollout_config
    dtype: STRING
    type: output
